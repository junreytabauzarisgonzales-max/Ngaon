name: go_core
description: Shared core for the Go apps (network, models, services, mock backend, widgets).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  get: 4.7.3
  dio: 5.11.1
  web_socket_channel: 3.0.3
  flutter_secure_storage: 11.2.0
  get_storage: 2.1.1
  google_maps_flutter: 2.19.0
  geolocator: 14.1.2
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_local_notifications: 23.0.2
  audioplayers: 6.8.1
  wakelock_plus: 1.8.0
  image_picker: 1.2.4
  flutter_image_compress: 2.5.1
  url_launcher: 6.3.3
  json_annotation: 4.12.0
  uuid: 4.6.0
  intl: 0.20.3
  cached_network_image: 4.0.7

dev_dependencies:
  flutter_lints: 6.0.0
  build_runner: 2.17.1
  json_serializable: 6.15.2
  fake_async: 1.3.3
  stream_channel: 2.1.4

flutter:
  assets:
    - assets/mock/
    - assets/sounds/
