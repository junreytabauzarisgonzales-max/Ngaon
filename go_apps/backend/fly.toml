# fly.toml app configuration file generated for ngaon-backend on 2026-11-16T20:21:40+08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ngaon-backend'
primary_region = 'sin'

[build]
[[mounts]]
  source = 'data'
  destination = '/data'

[env]
  PORT = '8080'
  PUBLIC_URL = 'https://api.ngaon.app'
  TZ = 'Asia/Manila'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
